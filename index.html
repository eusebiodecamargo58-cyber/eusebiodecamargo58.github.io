<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner de Figurinhas - Copa do Mundo 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 10px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            background-color: #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .focus-rectangle {
            position: absolute;
            top: 15%;
            left: 10%;
            width: 80%;
            height: 25%;
            border: 3px solid #00ff00;
            border-radius: 8px;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .focus-rectangle::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff00;
            font-size: 12px;
            white-space: nowrap;
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #scanButton {
            background: linear-gradient(135deg, #00ff00, #00cc00);
            color: #1a1a1a;
            border: none;
            padding: 16px 48px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #scanButton:hover:not(:disabled) {
            transform: scale(1.05);
        }

        #scanButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            font-size: 1rem;
            color: #888;
            text-align: center;
            min-height: 24px;
        }

        .result-container {
            width: 100%;
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .result-label {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
        }

        #result {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00ff00;
            word-break: break-all;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-message {
            color: #ff4444;
            font-size: 1rem;
            text-align: center;
            padding: 15px;
            background-color: #3a1a1a;
            border-radius: 8px;
            display: none;
        }

        #hiddenCanvas {
            display: none;
        }

        .instructions {
            font-size: 0.85rem;
            color: #666;
            text-align: center;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.2rem;
            }

            #scanButton {
                padding: 14px 40px;
                font-size: 1rem;
            }

            #result {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Scanner de Figurinhas</h1>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <div class="focus-rectangle"></div>
        </div>

        <div class="controls">
            <button id="scanButton">ESCANEAR</button>
            <div id="status">Inicializando...</div>
        </div>

        <div class="result-container">
            <div class="result-label">Código Detectado:</div>
            <div id="result">---</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="instructions">
            Posicione o código da figurinha dentro do retângulo verde e clique em ESCANEAR
        </div>

        <canvas id="hiddenCanvas"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const scanButton = document.getElementById('scanButton');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const errorMessage = document.getElementById('errorMessage');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');

        let isProcessing = false;

        // Initialize camera
        async function initCamera() {
            try {
                status.textContent = 'Solicitando acesso à câmera...';
                
                // Try rear camera first
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: { exact: "environment" },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    });
                } catch (exactError) {
                    console.log('Câmera traseira exata não disponível, tentando fallback...');
                    // Fallback to any camera
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: "environment",
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    });
                }

                video.srcObject = stream;
                await video.play();
                
                status.textContent = 'Câmera ativa. Pronto para escanear.';
                scanButton.disabled = false;
                
            } catch (error) {
                console.error('Erro ao acessar câmera:', error);
                status.textContent = 'Erro ao acessar câmera';
                showError('Não foi possível acessar a câmera. Verifique as permissões do navegador.');
                scanButton.disabled = true;
            }
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        // Capture and crop image from focus area
        function captureAndCropImage() {
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            
            // Calculate crop area based on focus rectangle position
            // Focus rectangle is at top: 15%, left: 10%, width: 80%, height: 25%
            const cropTop = Math.floor(videoHeight * 0.15);
            const cropLeft = Math.floor(videoWidth * 0.10);
            const cropWidth = Math.floor(videoWidth * 0.80);
            const cropHeight = Math.floor(videoHeight * 0.25);

            // Set canvas size to cropped area with higher resolution for better OCR
            const scaleFactor = 2;
            hiddenCanvas.width = cropWidth * scaleFactor;
            hiddenCanvas.height = cropHeight * scaleFactor;

            // Draw cropped region to canvas with scaling
            ctx.drawImage(
                video,
                cropLeft, cropTop, cropWidth, cropHeight,  // Source rectangle
                0, 0, cropWidth * scaleFactor, cropHeight * scaleFactor  // Destination rectangle
            );

            // Apply grayscale and aggressive contrast enhancement
            const imageData = ctx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                // Convert to grayscale using luminosity formula
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                
                // Aggressive contrast enhancement
                const contrast = 2.0;
                const enhanced = ((gray - 128) * contrast) + 128;
                const clamped = Math.max(0, Math.min(255, enhanced));

                // Apply threshold for binarization (black and white only)
                const threshold = 140;
                const binary = clamped > threshold ? 255 : 0;

                data[i] = binary;     // R
                data[i + 1] = binary; // G
                data[i + 2] = binary; // B
            }

            ctx.putImageData(imageData, 0, 0);

            return hiddenCanvas.toDataURL('image/png');
        }

        // Sanitize OCR result
        function sanitizeText(text) {
            return text
                .toUpperCase()
                .replace(/\n/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Process OCR
        async function processOCR() {
            if (isProcessing) return;
            
            isProcessing = true;
            scanButton.disabled = true;
            status.textContent = 'Processando...';
            result.textContent = '---';

            try {
                // Capture and crop image
                const imageData = captureAndCropImage();
                
                status.textContent = 'Reconhecendo texto...';

                // Perform OCR using Tesseract.js with optimized parameters
                const { data: { text } } = await Tesseract.recognize(
                    imageData,
                    'eng',
                    {
                        logger: (m) => {
                            if (m.status === 'recognizing text') {
                                status.textContent = `Reconhecendo... ${Math.round(m.progress * 100)}%`;
                            }
                        },
                        parameters: {
                            tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ',
                            tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE,
                            preserve_interword_spaces: '1'
                        }
                    }
                );

                // Sanitize the result
                const sanitizedText = sanitizeText(text);

                // Validate result
                if (sanitizedText.length < 2) {
                    result.textContent = '---';
                    showError('Código não detectado. Aproxime mais a câmera ou melhore a iluminação.');
                    status.textContent = 'Tente novamente';
                } else {
                    result.textContent = sanitizedText;
                    status.textContent = 'Código detectado com sucesso!';
                }

            } catch (error) {
                console.error('Erro no processamento OCR:', error);
                result.textContent = '---';
                showError('Erro ao processar imagem. Tente novamente.');
                status.textContent = 'Erro no processamento';
            } finally {
                isProcessing = false;
                scanButton.disabled = false;
            }
        }

        // Event listeners
        scanButton.addEventListener('click', processOCR);

        // Initialize on page load
        window.addEventListener('load', () => {
            scanButton.disabled = true;
            initCamera();
        });

        // Handle page visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && !video.srcObject) {
                initCamera();
            }
        });
    </script>
</body>
</html>
